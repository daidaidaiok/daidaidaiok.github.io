version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: chore
      include: scope
    groups:
      production-routine:
        dependency-type: production
        update-types: [minor, patch]
      development-routine:
        dependency-type: development
        update-types: [minor, patch]
      major-updates:
        patterns: ['*']
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-routine:
        patterns: ['*']
        update-types: [minor, patch]
      actions-major:
        patterns: ['*']
        update-types: [major]
