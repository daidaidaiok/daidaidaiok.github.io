<!DOCTYPE html>
<!-- served from daidaidaiok.github.io (consolidated) -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM 能力天梯</title>
  <meta name="description" content="按能力等价分组展示主流大语言模型（开源 + 闭源）">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">LLM 能力天梯</h1>
      <p class="site-subtitle">
        按能力等价分组 ·
        <span id="model-count">--</span> 个模型 ·
        数据更新于 <span id="updated-at">--</span>
      </p>
      <div class="controls">
        <div class="tabs" role="tablist">
          <button class="tab active" data-filter="all" role="tab">全部</button>
          <button class="tab" data-filter="open" role="tab">开源</button>
          <button class="tab" data-filter="closed" role="tab">闭源</button>
        </div>
        <input
          type="search"
          id="search"
          class="search"
          placeholder="搜索模型名或提供商..."
          aria-label="搜索模型"
        >
      </div>
    </div>
  </header>

  <main class="container" id="tiers-container">
    <!-- tiers 渲染到这里 -->
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        数据来源：
        <a href="https://huggingface.co/spaces/open-llm-leaderboard/open_llm_leaderboard" target="_blank" rel="noopener">HuggingFace Open LLM Leaderboard</a>
        +
        <a href="https://openrouter.ai" target="_blank" rel="noopener">OpenRouter</a>
        · 本页面不显示价格
      </p>
    </div>
  </footer>

  <script src="js/tiers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
