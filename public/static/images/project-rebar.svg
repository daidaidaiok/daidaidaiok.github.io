<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 306" fill="none">
  <rect width="544" height="306" rx="8" fill="#F1F5F9"/>
  <rect x="40" y="40" width="464" height="226" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <!-- 3D isometric cube (wireframe) -->
  <g transform="translate(196, 60)">
    <!-- top face -->
    <path d="M76 0 L136 30 L76 60 L16 30 Z" stroke="#475569" stroke-width="4" stroke-linejoin="round" fill="#CBD5E1" opacity="0.55"/>
    <!-- left face -->
    <path d="M16 30 L16 100 L76 130 L76 60 Z" stroke="#475569" stroke-width="4" stroke-linejoin="round" fill="#94A3B8" opacity="0.35"/>
    <!-- right face -->
    <path d="M76 60 L76 130 L136 100 L136 30 Z" stroke="#475569" stroke-width="4" stroke-linejoin="round" fill="#64748B" opacity="0.45"/>
    <!-- rebar lines inside right face -->
    <line x1="88" y1="68" x2="88" y2="118" stroke="#E2E8F0" stroke-width="3" opacity="0.9"/>
    <line x1="100" y1="75" x2="100" y2="125" stroke="#E2E8F0" stroke-width="3" opacity="0.7"/>
    <line x1="112" y1="82" x2="112" y2="132" stroke="#E2E8F0" stroke-width="3" opacity="0.5"/>
    <!-- horizontal stirrup lines -->
    <line x1="76" y1="82" x2="124" y2="106" stroke="#E2E8F0" stroke-width="3" opacity="0.8"/>
    <line x1="76" y1="104" x2="124" y2="128" stroke="#E2E8F0" stroke-width="3" opacity="0.6"/>
  </g>
  <!-- Rebar section circles -->
  <g fill="#334155">
    <circle cx="332" cy="86" r="7"/>
    <circle cx="352" cy="98" r="7"/>
    <circle cx="372" cy="110" r="7"/>
    <circle cx="332" cy="106" r="7"/>
    <circle cx="352" cy="118" r="7"/>
  </g>
  <line x1="332" y1="86" x2="332" y2="150" stroke="#334155" stroke-width="3" stroke-dasharray="6 6" opacity="0.4"/>
  <line x1="352" y1="98" x2="352" y2="150" stroke="#334155" stroke-width="3" stroke-dasharray="6 6" opacity="0.4"/>
  <!-- Sparkles -->
  <circle cx="110" cy="70" r="4" fill="#64748B" opacity="0.5"/>
  <circle cx="420" cy="180" r="3" fill="#94A3B8" opacity="0.6"/>
  <circle cx="150" cy="210" r="3" fill="#64748B" opacity="0.35"/>
  <!-- Title -->
  <text x="272" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1E293B">钢筋平法识图 3D 可视化学习</text>
</svg>